# colcon 기본값. scripts/env.sh 가 COLCON_DEFAULTS_FILE 로 가리키므로
# scripts/build.sh 로 돌리든 ros2_ws 에서 colcon 을 직접 치든 같은 옵션이 걸린다.
# 옵션을 래퍼 스크립트 안에만 두면 둘이 갈라지기 때문에 파일로 분리한다.
build:
  # 파이썬 노드와 launch·config 파일을 install/ 에 심볼릭 링크한다.
  # 고치고 다시 빌드하지 않아도 되니 개발 루프가 짧아진다.
  symlink-install: true
  cmake-args:
    # ROS 2 기본값은 빌드 타입이 비어 있어 최적화가 꺼진다. v2의 50Hz C++ 제어 루프를
    # 디버깅 가능한 채로 제대로 재려면 RelWithDebInfo 가 기준선이어야 한다.
    - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    # clangd · 에디터가 읽는 compile_commands.json (build/<pkg>/ 에 생긴다)
    - -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    # 컴파일러를 쓰지 않는 패키지(ty_bringup 같은 launch 전용)에서 위 두 변수가
    # '쓰이지 않았다'는 CMake 경고를 띄운다. 경고가 남아 있으면 진짜 경고를 놓친다.
    - --no-warn-unused-cli
test:
  # 실패한 패키지만 눈에 띄게. 성공 로그까지 쏟아내면 CI 출력에서 실패를 놓친다.
  event-handlers:
    - console_cohesion+
