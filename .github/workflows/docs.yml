# 문서 사이트 — main에 머지되면 빌드해서 GitHub Pages로 배포한다.
# PR에서는 빌드만 돌린다(--strict). 깨진 링크 · nav 누락이 머지 전에 걸린다.
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, README.md, mkdocs.yml, scripts/mkdocs_hooks.py, requirements-docs.txt, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, README.md, mkdocs.yml, scripts/mkdocs_hooks.py, requirements-docs.txt, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: 빌드 (경고 = 실패)
        run: mkdocs build --strict
      # docs/internal/ 은 비공개다. 어떤 경로로든 산출물에 섞이면 여기서 막는다.
      - name: 비공개 문서 유출 검사
        run: |
          if [ -e site/internal ] || grep -rql "docs/internal" site/ 2>/dev/null; then
            echo "::error::비공개 문서가 빌드 산출물에 포함됐다"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    # Pages 소스를 "GitHub Actions"로 설정해야 동작한다 (레포 설정, 사람이 한다)
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
