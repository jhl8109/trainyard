provenance:
  ticket: TY-13
  mujoco: 3.13.0
  menagerie_commit: 822c2d8
  scene_sha256: 7e22969f39ece9c7
  method: >-
    테이블 작업 영역을 20mm 격자로 나눠 각 셀 중심에 top-down 파지 자세로 IK를 풀고
    (감쇠 최소자승, 위치 오차 < 0.5mm), 관절 한계 여유 10% 이상인 셀만 남긴 뒤
    경계에서 한 칸 안으로 줄이고 목표 존과 겹치는 셀을 뺐다. 남은 영역에서 가장자리 층을
    B로 떼어내고 안쪽을 A로 삼았다 — A가 60%를 넘으면 층을 한 겹 더 벗긴다.
