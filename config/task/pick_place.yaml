# pick-and-place 태스크 파라미터 — **생성물이다. 손으로 고치지 않는다.**
#
#   PYTHONPATH=platform/src .venv/bin/python -m trainyard.sim.reach --out config/task/pick_place.yaml
#
# 근거는 docs/task-pick-place.md. 여기 있는 수치의 성격은 두 가지다.
#   - 확정 수치(§2 · §3): 물체 · 목표 존 크기 · 성공 판정 — 문서에서 그대로 옮겨온다.
#   - 측정 수치(§6): 스폰 격자 — SO-101 MJCF에 top-down IK를 풀어 얻은 결과다 (TY-13).
# 이 파일을 읽는 곳: 씬 리셋(TY-17) · 평가 조건표(TY-44) · 성공 판정(TY-106) · RL 보상(TY-111).
schema_version: 1

# 베이스 하단 중심이 원점, +x 정면 · +y 왼쪽 · z 위. 테이블 상판 z = 0. 단위 m · rad.
frame: base

table:
  center: [0.1700, 0.0000]
  size: [0.3000, 0.4000]   # x(깊이) × y(폭)
  top_z: 0.0

object:
  type: cube
  size: 0.025      # 한 변
  mass: 0.02
  spawn_z: 0.0125   # 중심 높이 = 한 변의 절반

# v0~v4 내내 고정 (docs §2). 스폰 격자는 이 사각형 + 물체 반폭만큼을 비워둔다.
target_zone:
  center: [0.1000, 0.1500]
  size: [0.0800, 0.0800]

# 성공 판정 (docs §3 — 확정). placed AND settled AND intact.
success:
  placed_z_max: 0.02
  settle_speed_max: 0.02
  settle_hold_s: 0.5
  timeout_s: 20.0
  lift_height: 0.05        # grasp_miss 판정 기준 (docs §4)

# 평가 조건표 축 (docs §6). 큐브는 90° 주기라 yaw 셋으로 전 범위를 덮는다.
evaluation:
  yaw_deg: [0, 30, 60]
  seeds: 5
  position_jitter: 0.003   # ±3mm
  yaw_jitter_deg: 3.0

spawn_grid:
  pitch: 0.020
  grasp_z: 0.0125
  joint_margin_min: 0.10   # 관절 한계까지 남은 여유 / 가동범위
  inner_ratio_max: 0.60   # A가 이 비율을 넘으면 층을 한 겹 더 벗긴다
  counts:
    grid: 300
    ik_solved: 264
    candidate: 180       # IK 해 + 관절 여유 10% 이상
    eroded: 127          # 경계에서 한 칸 안쪽
    zone_excluded: 13
    A: 55
    B_edge: 59
    B_interp: 32
    A_ratio: 0.48
  # 학습 분포 A — 시연 수집(docs §9)과 학습은 여기서만 샘플한다.
